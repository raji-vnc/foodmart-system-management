<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        body {
            font-family: "Poppins", sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .profile-card {
            background: white;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 400px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        .info {
            margin: 10px 0;
            color: #555;
        }
        .logout-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.3s;
        }
        .logout-btn:hover {
            background: #e60000;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <h2>My Profile</h2>
        <p class="info"><strong>Username:</strong> {{ user.username }}</p>
        <p class="info"><strong>Email:</strong> {{ user.email }}</p>

        <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
    </div>
</body>
</html>
