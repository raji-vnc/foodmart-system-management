<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{% static 'assets/dashboard/admin_dashboard.css' %}">
</head>
<body>
  <div class="form-container">
    <h2>{{ title }}</h2>
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn save-btn">Save</button>
      <a href="{% url 'admin_dashboard' %}" class="btn cancel-btn">Cancel</a>
    </form>
  </div>
</body>
</html>
