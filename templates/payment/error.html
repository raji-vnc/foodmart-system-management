<!DOCTYPE html>
<html>
<head>
    <title>Payment Error</title>
    <style>
        body {
            font-family: Arial;
            background-color: #fff0f0;
            color: #800000;
            text-align: center;
            padding-top: 50px;
        }
        .error-box {
            display: inline-block;
            padding: 20px 30px;
            background: #ffe6e6;
            border: 1px solid #ff9999;
            border-radius: 10px;
        }
        a {
            color: #800000;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="error-box">
        <h2>⚠️ Payment Failed</h2>
        <p>{{ message }}</p>
        <a href="{% url 'payment' %}">Try Again</a>
    </div>
</body>
</html>
