{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dummy Payment (CVC only)</title>
  <link rel="stylesheet" href="{% static 'assets/dashboard/index.css' %}">
  <style>
    body{font-family:Poppins, sans-serif; background:#f3f4f6; display:flex; align-items:center; justify-content:center; height:100vh;}
    .box{background:#fff;padding:30px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,0.08); width:360px;}
    .box h2{margin-bottom:12px}
    .field{margin-bottom:12px}
    input[type="text"]{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:1rem}
    .btn{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer}
    .note{font-size:0.9rem;color:#6b7280;margin-bottom:12px}
  </style>
</head>
<body>
  <div class="box">
    <h2>Dummy Checkout — Test Mode</h2>
    <p class="note">This is a development demo. No real money will be charged.</p>

    {% if messages %}
      {% for m in messages %}
        <p style="color:{% if m.tags == 'success' %}green{% else %}red{% endif %}; font-weight:600:">{{ m }}</p>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="field">
        <label for="cvc">Card CVC</label>
        <input id="cvc" name="cvc" type="text" maxlength="4" placeholder="123" required>
      </div>

      <p style="text-align:right; font-weight:600">Amount: ₹{{ total }}</p>

      <button class="btn" type="submit">Pay (Dummy)</button>
    </form>
  </div>
</body>
</html>
